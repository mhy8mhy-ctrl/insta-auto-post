name: 毎日の投稿
on:
  schedule:
    # 2026-11-14：毎正時の予約はGitHub側で数時間遅れる(21時予定→翌4時台)ため、半端な分にずらし予備を1回足す。
    # 2回目は直近12時間に投稿済みなら何もしない(post.py)
    - cron: "41 11 * * *"  # 日本時間 20:41
    - cron: "13 13 * * *"  # 日本時間 22:13(予備)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると投稿せず中身だけ表示"
        default: "0"
      probe:
        description: "1にするとトークンの確認だけ行う"
        default: "0"
permissions:
  contents: write
concurrency: insta-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 投稿
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROBE: ${{ inputs.probe }}
          IG_API: ${{ vars.IG_API }}
        run: python3 post.py
      - name: 投稿済みへ移した結果を保存
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "投稿済みへ移動" && git push)
