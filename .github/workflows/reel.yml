name: 毎朝のリール
on:
  schedule:
    - cron: "0 22 * * *"   # 日本時間 7:00(前の晩のカルーセルをリールにして出す)
    - cron: "0 3 * * *"    # 日本時間 12:00 昼の枠(queue/の先の日付をリール専用で出す。在庫4本未満なら出さない)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると動画だけ作って投稿しない"
        default: "0"
permissions:
  contents: write
concurrency: insta-post
env:
  REEL_SLOT: ${{ github.event.schedule == '0 3 * * *' && 'noon' || 'morning' }}
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpegを入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: リール動画を作る
        run: python3 reel.py build
      - name: 動画を保存(投稿に公開URLが要るため)
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "リール動画を追加" && git push)
      - name: リールを投稿
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          IG_API: ${{ vars.IG_API }}
        run: python3 reel.py post
      - name: 記録を保存
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "リール投稿を記録" && git push)
