name: 毎朝のリール
on:
  schedule:
    # 2026-11-14：毎正時を避けて半端な分にずらし、各枠に予備を1回足す(直近90分にリールを出していたら何もしない)
    - cron: "47 21 * * *"  # 日本時間 6:47 朝の枠(前の晩のカルーセルをリールにして出す)
    - cron: "19 23 * * *"  # 日本時間 8:19 朝の枠の予備
    - cron: "37 2 * * *"   # 日本時間 11:37 昼の枠(queue/の先の日付をリール専用で出す。在庫4本未満なら出さない)
    - cron: "11 4 * * *"   # 日本時間 13:11 昼の枠の予備
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると動画だけ作って投稿しない"
        default: "0"
permissions:
  contents: write
concurrency: insta-post
env:
  REEL_SLOT: ${{ (github.event.schedule == '37 2 * * *' || github.event.schedule == '11 4 * * *') && 'noon' || 'morning' }}
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpegを入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: リール動画を作る
        run: python3 reel.py build
      - name: 動画を保存(投稿に公開URLが要るため)
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "リール動画を追加" && git push)
      - name: リールを投稿
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          IG_API: ${{ vars.IG_API }}
        run: python3 reel.py post
      - name: 記録を保存
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "リール投稿を記録" && git push)
