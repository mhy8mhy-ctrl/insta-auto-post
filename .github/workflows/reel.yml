name: 毎日のリール
on:
  schedule:
    # 2026-11-15 大将決定：カルーセルはビューがほぼ0 → 夜の枠もリールに(朝の枠は前夜カルーセルの動画化なので停止)。
    # GitHubの定時実行が5〜8時間遅れる(11/15実測：昼11:37→18:51、夜20:41→翌2:59)ため、ねらいの時刻より約5時間早く予約する。予備は同じ枠で12時間以内に出していれば何もしない
    - cron: "7 22 * * *"   # 日本時間 7:07 昼の枠(ねらい12時ごろ。queue/の先の日付をリール専用で出す。在庫4本未満なら出さない)
    - cron: "41 23 * * *"  # 日本時間 8:41 昼の枠の予備
    - cron: "41 6 * * *"   # 日本時間 15:41 夕方の枠(ねらい21時ごろ。queue/の今日の1本をリールで出す)
    - cron: "13 8 * * *"   # 日本時間 17:13 夕方の枠の予備
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると動画だけ作って投稿しない"
        default: "0"
      slot:
        description: "手動で出すときの枠(evening/noon/morning)"
        default: "evening"
permissions:
  contents: write
concurrency: insta-post
env:
  REEL_SLOT: ${{ (github.event.schedule == '7 22 * * *' || github.event.schedule == '41 23 * * *') && 'noon' || ((github.event.schedule == '41 6 * * *' || github.event.schedule == '13 8 * * *') && 'evening' || (inputs.slot || 'evening')) }}
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpegを入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: リール動画を作る
        run: python3 reel.py build
      - name: 動画を保存(投稿に公開URLが要るため)
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "リール動画を追加" && git push)
      - name: リールを投稿
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          IG_API: ${{ vars.IG_API }}
        run: python3 reel.py post
      - name: 記録を保存
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "リール投稿を記録" && git push)
